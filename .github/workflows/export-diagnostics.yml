name: Isolated export controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned official tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Set-Content vendor/.gdignore ''
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip' -OutFile vendor/godot.zip
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz' -OutFile vendor/templates.zip
          if ((Get-FileHash vendor/godot.zip).Hash.ToLowerInvariant() -ne '02a5312236f4e0209c78bcb2f52135b1963e6b8888c873c9cee81459e60bcd71') { throw 'Godot hash mismatch' }
          if ((Get-FileHash vendor/templates.zip).Hash.ToLowerInvariant() -ne '9714459dc071907c0f3d5f17d608faf69e7cda21331fc5d39c4503ffa4e99eec') { throw 'Template hash mismatch' }
          Expand-Archive vendor/godot.zip vendor/godot
          Expand-Archive vendor/templates.zip vendor/templates
          ./scripts/setup-gua.ps1
      - name: Compare disposable projects with and without Gua 1.1.2
        shell: pwsh
        run: ./scripts/diagnose-export.ps1 -Godot "$pwd/vendor/godot/Godot_v4.7-stable_win64_console.exe" -TemplateDirectory "$pwd/vendor/templates/templates"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-control-evidence
          path: |
            artifacts/export-diagnostics/**/comparison.json
            artifacts/export-diagnostics/**/editor.log
            artifacts/export-diagnostics/**/console.log
